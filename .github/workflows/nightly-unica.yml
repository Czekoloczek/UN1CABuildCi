# .github/workflows/nightly-unica.yml
#
# Nightly UN1CA for p3s (Galaxy S21 Ultra, SM-G998B).
#
# Builds salvogiangri/UN1CA@sixteen, swaps in FloppyKernel's boot images so the
# ROM carries its own kernel + root, signs, splits into <2 GiB parts and
# publishes them as a Release together with an updater manifest.
#
# The whole shape is copied from how UN1CA actually ships, which we established
# by capturing the updater's traffic on-device:
#   manifest  raw.githubusercontent.com/UN1CA/static_resources/sixteen/updates/manifest.json
#   packages  Release assets in that same repo, split into 1536 MiB parts
#   changelog updates/<version>.txt
# There is no server anywhere in that design, and there is none here either.
#
# WHY THE KERNEL IS BUNDLED
# The OTA writes boot.img (see install-end.edify and build_full_ota_zip.sh), so
# every update would otherwise replace FloppyKernel with UN1CA's stock kernel
# and take ReSukiSU down with it. Injecting FloppyKernel into the build means an
# update keeps the kernel and root instead of eating them.
#
# WHY THE BUILD IS SPLIT IN TWO STEPS
# create_target_files_zip.sh AVB-signs each kernel binary as it copies it out of
# $WORK_DIR/kernel. Injecting into the finished zip would therefore ship an
# unsigned image, so we stop after the ROM build (-x), drop the kernel in, then
# drive packaging directly. Going back through make_rom.sh instead would put us
# at the mercy of its .completed/hash logic for whether it rebuilds everything.

name: Nightly UN1CA (p3s)

on:
  schedule:
    # 03:40 UTC daily. Upstream pushes irregularly; the gate below makes a run
    # with nothing new cost about a minute.
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target codename'
        type: string
        default: 'p3s'
      bundle_kernel:
        description: 'Inject FloppyKernel boot images (off = stock UN1CA kernel, no root)'
        type: boolean
        default: true
      force:
        description: 'Build even if this upstream commit was already published'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unica-nightly
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/salvogiangri/UN1CA.git
  BRANCH: sixteen
  KERNEL_REPO: Czekoloczek/FloppyExynos2100Ci
  PART_SIZE: 1536M          # same split size UN1CA itself uses; 2 GiB is the cap

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Resolve upstream commit
        id: up
        run: |
          SHA=$(git ls-remote "$UPSTREAM" "refs/heads/$BRANCH" | cut -f1)
          [ -n "$SHA" ] || { echo "Could not resolve upstream SHA"; exit 1; }
          echo "sha=$SHA"         >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "Upstream $BRANCH is at $SHA"

      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          SHORT: ${{ steps.up.outputs.short }}
        run: |
          if [ "$FORCE" != "true" ] && \
             gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name' \
               | grep -qE "^nightly-[0-9]{8}-${SHORT}$"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Commit ${SHORT} already published — nothing to do."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space (1/3)
        if: steps.gate.outputs.build == 'true'
        run: |
          echo -n 'BEFORE: '; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        if: steps.gate.outputs.build == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        if: steps.gate.outputs.build == 'true'
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Report disk
        if: steps.gate.outputs.build == 'true'
        run: |
          # Run #1 of the measurement workflow drew a 72 GB runner and died with
          # ENOSPC; run #2 drew 145 GB and finished. The size is luck of the
          # draw, so record it — a failed nightly is usually just a small runner.
          echo -n 'AFTER CLEANUP: '; df -h / | tail -1

      - name: Clone upstream
        if: steps.gate.outputs.build == 'true'
        run: |
          git clone --depth 1 --recurse-submodules --branch "$BRANCH" "$UPSTREAM" unica-src

      - name: Set up build environment
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp lz4
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No unica_platform/unica_ota keys: apktool.sh falls back to
          # security/aosp_platform.* and OTAs get signed with aosp_testkey.
          # Custom recovery does not check otacerts, so that is fine here.

      - name: Set up JDK 17
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        if: steps.gate.outputs.build == 'true'
        working-directory: unica-src
        run: |
          source ./buildenv.sh "${{ inputs.target || 'p3s' }}"
          {
            echo "DEBUG=$DEBUG";         echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR";     echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR";       echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR";   echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        if: steps.gate.outputs.build == 'true'
        working-directory: unica-src
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        if: steps.gate.outputs.build == 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: cd unica-src && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        if: steps.gate.outputs.build == 'true'
        working-directory: unica-src
        run: ./scripts/extract_fw.sh

      - name: Reclaim dependency build trees
        if: steps.gate.outputs.build == 'true'
        run: |
          # build_dependencies.sh leaves cmake/gradle trees in external/ after
          # copying the finished binaries to out/tools/bin. Worth about 1 GB —
          # not the win originally assumed, but free.
          rm -rf unica-src/external/*/build
          rm -rf unica-src/external/apktool/brut.apktool/*/build
          rm -rf ~/.gradle/caches ~/.gradle/wrapper
          test -x unica-src/out/tools/bin/apktool
          test -x unica-src/out/tools/bin/mkfs.erofs
          echo -n 'AFTER PRUNE: '; df -h / | tail -1

      - name: Build ROM (no packaging yet)
        if: steps.gate.outputs.build == 'true'
        working-directory: unica-src
        run: ./scripts/make_rom.sh -x

      - name: Inject FloppyKernel boot images
        if: steps.gate.outputs.build == 'true' && inputs.bundle_kernel != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$KERNEL_REPO" --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$TAG" ] || { echo "No FloppyKernel release found in $KERNEL_REPO"; exit 1; }
          echo "FloppyKernel release: $TAG"
          gh release download "$TAG" --repo "$KERNEL_REPO" --pattern 'FloppyOneUI_*.tar' --dir kern
          tar -xf kern/FloppyOneUI_*.tar -C kern

          # The Odin tar ships boot.img.lz4 and vendor_boot.img.lz4; both names
          # are in create_target_files_zip.sh's KERNEL_BINS, so replace both
          # rather than leaving a stock vendor_boot next to a Floppy boot.
          for img in boot vendor_boot; do
            [ -f "kern/${img}.img.lz4" ] || { echo "Missing ${img}.img.lz4 in the tar"; exit 1; }
            lz4 -d -f "kern/${img}.img.lz4" "kern/${img}.img"
            cp -f "kern/${img}.img" "$WORK_DIR/kernel/${img}.img"
            echo "injected ${img}.img ($(stat -c %s "kern/${img}.img") B)"
          done
          echo "KERNEL_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Package target-files and flashable zip
        id: pack
        if: steps.gate.outputs.build == 'true'
        working-directory: unica-src
        run: |
          # Driven directly rather than via make_rom.sh -z so the kernel we just
          # injected is picked up without re-running the whole ROM build.
          TF="$OUT_DIR/${{ inputs.target || 'p3s' }}-target_files.zip"
          ./scripts/internal/create_target_files_zip.sh "$TF"
          ./scripts/build_flashable_zip.sh "$TF"
          rm -f "$TF"        # 6 GB we do not publish; free it before splitting

          shopt -s nullglob
          zips=("$OUT_DIR"/UN1CA_*.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "Expected one flashable zip, got ${#zips[@]}"; printf '%s\n' "${zips[@]}"; exit 1; }
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${zips[0]}")" >> "$GITHUB_OUTPUT"
          ls -lh "${zips[0]}"

      - name: Split and checksum
        id: split
        if: steps.gate.outputs.build == 'true'
        run: |
          mkdir -p dist && cd dist
          ZIP='${{ steps.pack.outputs.zip }}'
          NAME='${{ steps.pack.outputs.name }}'
          split -b "$PART_SIZE" -d -a 2 "$ZIP" "$NAME."
          sha256sum "$NAME".* > "$NAME.sha256"
          # Whole-file digest doubles as the manifest's update id and lets you
          # verify the reassembly, not just the individual parts.
          FULL=$(sha256sum "$ZIP" | cut -d' ' -f1)
          echo "full_sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "$FULL  $NAME (reassembled)" >> "$NAME.sha256"
          ls -lh; echo; cat "$NAME.sha256"

      - name: Publish release
        id: rel
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.up.outputs.short }}
        run: |
          TAG="nightly-$(date -u +%Y%m%d)-${SHORT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "Automated nightly of salvogiangri/UN1CA@${{ steps.up.outputs.sha }}"
            echo
            echo "Device: \`${{ inputs.target || 'p3s' }}\`  •  ROM version: \`${ROM_VERSION:-unknown}\`"
            if [ -n "$KERNEL_TAG" ]; then
              echo "Kernel: FloppyKernel \`$KERNEL_TAG\` (ReSukiSU) — boot and vendor_boot replaced"
            else
              echo "Kernel: stock UN1CA — **no root**"
            fi
            echo
            echo "Unofficial build: APKs signed with the AOSP test key, OTA with \`aosp_testkey\`."
            echo "ChoiDujour is not included (upstream gates it on official builds)."
            echo
            echo '### Flashing'
            echo 'Download every part plus the `.sha256`, then reassemble:'
            echo '```bash'
            echo "cat ${{ steps.pack.outputs.name }}.?? > ${{ steps.pack.outputs.name }}"
            echo "sha256sum -c ${{ steps.pack.outputs.name }}.sha256"
            echo '```'
            echo 'Flash the result in recovery. Requires bootloader `G998BXXSJHZC2`; the'
            echo "installer refuses afaneh92's recovery builds."
          } > notes.md

          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            -t "UN1CA nightly ${{ steps.up.outputs.short }} (${{ inputs.target || 'p3s' }})" \
            -F notes.md dist/*

      - name: Update manifest and changelog
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pack.outputs.name }}
          TAG: ${{ steps.rel.outputs.tag }}
          FULL_SHA: ${{ steps.split.outputs.full_sha }}
          SIZE: ${{ steps.split.outputs.size }}
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # build_info.txt inside the flashable zip is the same source
          # generate_ota_manifest.sh reads; take the security patch level from it
          # so the entry matches what an updater expects to compare against.
          PATCH=$(unzip -p '${{ steps.pack.outputs.zip }}' build_info.txt 2>/dev/null \
                  | grep '^security_patch_version=' | cut -d= -f2- || true)
          export PATCH BASE

          mkdir -p updates
          python3 - "$NAME" "$BASE" "$TAG" <<'PY'
          import json, os, sys, pathlib
          name, base, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          parts = sorted(p.name for p in pathlib.Path('dist').iterdir()
                         if p.name.startswith(name + '.') and not p.name.endswith('.sha256'))
          entry = {
              "datetime": int(os.environ.get("ROM_BUILD_TIMESTAMP") or 0),
              "device":   os.environ.get("TARGET_CODENAME", "p3s"),
              "filename": name,
              "id":       os.environ["FULL_SHA"],
              "incremental": False,
              "patch":    os.environ.get("PATCH", ""),
              "size":     int(os.environ["SIZE"]),
              "urls":     [f"{base}/{p}" for p in parts],
              "version":  os.environ.get("ROM_VERSION", ""),
          }
          mf = pathlib.Path("updates/manifest.json")
          data = json.loads(mf.read_text()) if mf.exists() else {"response": []}
          data["response"] = [e for e in data["response"] if e["id"] != entry["id"]] + [entry]
          data["response"].sort(key=lambda e: e["datetime"])
          mf.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          print(f"manifest now has {len(data['response'])} entries; newest urls: {len(entry['urls'])} parts")
          PY

          printf 'UN1CA nightly %s\nUpstream: %s\nKernel: %s\n' \
            "${ROM_VERSION:-unknown}" "${{ steps.up.outputs.sha }}" "${KERNEL_TAG:-stock}" \
            > "updates/${ROM_VERSION:-unknown}.txt"

          git add updates
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "updates: publish ${TAG}" || { echo "nothing to commit"; exit 0; }
          git push
