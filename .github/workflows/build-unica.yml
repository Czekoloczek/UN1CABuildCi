# .github/workflows/build-unica.yml
#
# Builds salvogiangri/UN1CA from the latest commit on `sixteen` for a single
# target, on a stock GitHub runner.
#
# THIS IS A MEASUREMENT RUN, NOT A RELEASE PIPELINE. It deliberately does not
# publish anything by default. The two things we want out of it:
#   1. does the build pass at all without upstream's signing secrets?
#   2. how much disk does it eat, and how big is the resulting zip?
#
# On (1): upstream's own CI injects secrets.PLATFORM_KEY_PK8/PEM into
# security/unica_platform.*. We don't have those and don't need them —
# scripts/apktool.sh picks its cert prefix as:
#     local CERT_PREFIX="aosp"; $ROM_IS_OFFICIAL && CERT_PREFIX="unica"
# and security/aosp_platform.{pk8,x509.pem} ship in the repo. So without the
# secrets the build is simply "unofficial": APKs get signed with the AOSP test
# key, OTA zips with aosp_testkey, and the ChoiDujour OTA app is skipped.
#
# On (2): GitHub Release assets cap at 2 GiB per file, and upstream attaches
# ZERO assets to its own releases — a One UI ROM zip is far above that cap.
# That is why this workflow measures first and publishes nothing.
#
# The disk-freeing trio is lifted from upstream's ci.yml, which builds all 11
# targets on ubuntu-24.04 — so a single target is known to fit.

name: Build UN1CA (measure)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target codename (p3s = S21 Ultra SM-G998B)'
        type: string
        default: 'p3s'
      build_zip:
        description: 'Also build the flashable zip (make_rom.sh -z), not just target-files'
        type: boolean
        default: true
      upload_artifact:
        description: 'Upload the output as an artifact (SLOW for multi-GB files)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/salvogiangri/UN1CA.git
  BRANCH: sixteen

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub hard-kills a job at 6 h. Stop just short so the size report below
    # still runs instead of the whole thing vanishing mid-step.
    timeout-minutes: 340

    defaults:
      run:
        shell: bash

    steps:
      - name: Free disk space (1/3)
        run: |
          df -h / | tail -1 | sed 's/^/BEFORE: /'
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Report free space after cleanup
        run: |
          echo -n 'AFTER CLEANUP: '; df -h / | tail -1

      - name: Clone upstream
        run: |
          git clone --depth 1 --recurse-submodules \
            --branch "${BRANCH}" "${UPSTREAM}" unica-src
          echo "UPSTREAM_SHA=$(git -C unica-src rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Upstream ${BRANCH} @ $(git -C unica-src rev-parse --short HEAD)"

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No unica_platform.* written here on purpose — see the header comment.

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        working-directory: unica-src
        run: |
          # buildenv.sh finds the tree root by walking up for unica/configs/version.sh,
          # so it has to be sourced from inside the clone.
          source ./buildenv.sh "${{ inputs.target }}"
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Confirm build is unofficial (expected)
        working-directory: unica-src
        run: |
          echo "ROM_IS_OFFICIAL=$(grep '^ROM_IS_OFFICIAL' out/config.sh || echo '<unset>')"
          echo "ROM_VERSION=$(grep '^ROM_VERSION' out/config.sh || echo '<unset>')"

      - name: Build dependencies
        working-directory: unica-src
        run: ./scripts/build_dependencies.sh

      - name: Report free space after deps
        run: |
          echo -n 'AFTER DEPS: '; df -h / | tail -1

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: cd unica-src && ./scripts/download_fw.sh

      - name: Report free space after firmware download
        run: |
          df -h / | tail -1 | sed 's/^/AFTER FW DOWNLOAD: /'
          du -sh unica-src/out/fw 2>/dev/null | sed 's/^/FW DIR: /' || true

      - name: Extract stock firmwares
        working-directory: unica-src
        run: ./scripts/extract_fw.sh

      - name: Report free space after extract
        run: |
          echo -n 'AFTER EXTRACT: '; df -h / | tail -1

      - name: Build ROM
        working-directory: unica-src
        run: |
          if [ "${{ inputs.build_zip }}" == "true" ]; then
            ./scripts/make_rom.sh -z
          else
            ./scripts/make_rom.sh
          fi

      # This is the actual payload of the run: what got produced and how big.
      - name: Size report
        if: always()
        run: |
          echo "=============== DISK ==============="
          df -h / | tail -1
          echo
          echo "=============== OUTPUTS ==============="
          if [ -d unica-src/out ]; then
            find unica-src/out -maxdepth 2 -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.md5' \) \
              -printf '%s\t%p\n' | sort -rn | while IFS=$'\t' read -r size path; do
                printf '%8d MiB  %s\n' "$(( size / 1048576 ))" "${path#unica-src/out/}"
              done
            echo
            echo "--- 2 GiB Release cap check ---"
            find unica-src/out -maxdepth 2 -type f -name '*.zip' -printf '%s\t%p\n' | while IFS=$'\t' read -r size path; do
              if [ "$size" -gt 2147483648 ]; then
                echo "OVER CAP  ($(( size / 1048576 )) MiB)  ${path#unica-src/out/}"
              else
                echo "fits      ($(( size / 1048576 )) MiB)  ${path#unica-src/out/}"
              fi
            done
          else
            echo "No out/ directory — build did not get that far."
          fi

      - name: Upload artifact
        if: inputs.upload_artifact && success()
        uses: actions/upload-artifact@v4
        with:
          name: unica-${{ inputs.target }}-${{ env.UPSTREAM_SHA }}
          path: |
            unica-src/out/*.zip
          if-no-files-found: error
          compression-level: 0
